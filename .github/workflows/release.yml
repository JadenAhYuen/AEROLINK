name: Verify and package AEROLINK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev

  windows:
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download verified MediaMTX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tools/mediamtx-1.21.2 | Out-Null
          Invoke-WebRequest 'https://github.com/bluenviron/mediamtx/releases/download/v1.21.2/mediamtx_v1.21.2_windows_amd64.zip' -OutFile .tools/mediamtx.zip
          if ((Get-FileHash .tools/mediamtx.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a84224f5a490855684e62ba6fb71e80ea2a5e16aed61883bb58380290e93e467') { throw 'MediaMTX checksum mismatch' }
          Expand-Archive .tools/mediamtx.zip .tools/mediamtx-1.21.2 -Force
      - run: npm run build:windows
      - name: Smoke-test portable launcher
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $directory = Resolve-Path "dist/AEROLINK-$version-windows-x64"
          $test = Start-Process "$directory/AEROLINK.exe" -ArgumentList '--smoke-test' -PassThru
          if (-not $test.WaitForExit(30000)) { $test.Kill(); throw 'Launcher test timed out' }
          if ($test.ExitCode -ne 0) { throw (Get-Content "$directory/launcher-smoke-test.txt" -Raw) }
          Get-Content "$directory/launcher-smoke-test.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: AEROLINK-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256.txt
      - name: Publish Windows release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists; keeping existing assets."; exit 0 }
          gh release create $tag dist/*.zip dist/*.sha256.txt --target $env:GITHUB_SHA --title "AEROLINK $tag" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
