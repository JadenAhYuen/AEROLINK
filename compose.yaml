services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.2
    restart: unless-stopped
    environment:
      MTX_WEBRTCADDITIONALHOSTS: "${HOST_IP:-127.0.0.1}"
    ports:
      - "1935:1935"
      - "8889:8889"
      - "8189:8189/udp"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  dashboard:
    build: .
    restart: unless-stopped
    depends_on:
      - mediamtx
    environment:
      MEDIAMTX_API_URL: http://mediamtx:9997
      TELEMETRY_TOKEN: "${TELEMETRY_TOKEN:-}"
    ports:
      - "3000:3000"
